# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
        profile_images_directory: '%kernel.project_dir%/public/uploads/profile_images'
        world_images_directory: '%kernel.project_dir%/public/uploads/world_images'
        heroes_images_directory: '%kernel.project_dir%/public/uploads/heroes'
        factions_images_directory: '%kernel.project_dir%/public/uploads/factions'
        races_images_directory: '%kernel.project_dir%/public/uploads/races'
        continents_images_directory: '%kernel.project_dir%/public/uploads/continents'
        domains_images_directory: '%kernel.project_dir%/public/uploads/domains'
        capacities_images_directory: '%kernel.project_dir%/public/uploads/capacities'
        guilds_images_directory: '%kernel.project_dir%/public/uploads/guilds'
        cities_images_directory: '%kernel.project_dir%/public/uploads/cities'

services:
    # Configuration du rognageur d'images
    _defaults:
        autowire: true     
        autoconfigure: true 
    App\Service\ImageResizerService:
        arguments:
            $targetSize: 1024
    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
